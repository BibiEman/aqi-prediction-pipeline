name: AQI Daily Monitoring

"on":
  schedule:
    # 01:00 UTC every day
    - cron: "0 1 * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aqi-daily-monitoring
  cancel-in-progress: false

jobs:
  daily-monitoring:
    runs-on: ubuntu-latest

    timeout-minutes: 45

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      # ======================================================
      # STEP 1
      # Checkout latest main branch
      # ======================================================

      - name: Checkout latest main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      # ======================================================
      # STEP 2
      # Force synchronization with latest origin/main
      # ======================================================

      - name: Synchronize with latest main
        shell: bash
        run: |
          echo "Fetching latest main branch..."

          git fetch origin main

          git reset --hard origin/main

          echo ""
          echo "Current Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Latest commit:"
          git log -1 --oneline

      # ======================================================
      # STEP 3
      # Verify updated monitoring code
      # ======================================================

      - name: Verify monitoring source code
        shell: bash
        run: |
          echo "Checking cross-platform monitoring implementation..."

          if grep -q "resolve_production_model_path" src/monitoring/monitor.py; then
            echo "SUCCESS: New cross-platform model loader found."
          else
            echo "ERROR: Old monitor.py was checked out."
            exit 1
          fi

          echo ""
          echo "Model-path code:"
          grep -n "resolve_production_model_path" src/monitoring/monitor.py

          echo ""
          echo "Checking for old Windows-path loading logic..."

          if grep -Fq 'Path(production_info["model_path"])' src/monitoring/monitor.py; then
            echo "ERROR: Old production model loader still exists."
            exit 1
          else
            echo "SUCCESS: Old absolute-path loader is not present."
          fi

      # ======================================================
      # STEP 4
      # Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      # ======================================================
      # STEP 5
      # Dependencies
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install monitoring dependencies
        run: |
          pip install -r requirements-automation.txt

      # ======================================================
      # STEP 6
      # Display package versions
      # ======================================================

      - name: Display ML environment
        run: |
          python --version

          python -c "import sklearn; print('scikit-learn:', sklearn.__version__)"
          python -c "import lightgbm; print('lightgbm:', lightgbm.__version__)"
          python -c "import hopsworks; print('hopsworks:', hopsworks.__version__)"
          python -c "import hsfs; print('hsfs:', hsfs.__version__)"

      # ======================================================
      # STEP 7
      # Secrets
      # ======================================================

      - name: Validate secrets
        shell: bash
        run: |
          MISSING=0

          if [ -z "${OPENWEATHER_API_KEY:-}" ]; then
            echo "OPENWEATHER_API_KEY is unavailable."
            MISSING=1
          else
            echo "OPENWEATHER_API_KEY is configured."
          fi

          if [ -z "${HOPSWORKS_API_KEY:-}" ]; then
            echo "HOPSWORKS_API_KEY is unavailable."
            MISSING=1
          else
            echo "HOPSWORKS_API_KEY is configured."
          fi

          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi

      # ======================================================
      # STEP 8
      # Verify production artifact
      # ======================================================

      - name: Verify production model artifact
        shell: bash
        run: |
          MODEL_PATH="models/registry/LightGBM/v1/model.pkl"

          echo "Expected production artifact:"
          echo "$MODEL_PATH"

          if [ ! -f "$MODEL_PATH" ]; then
            echo "ERROR: Production model is missing."

            echo ""
            echo "Registry directory contents:"

            find models/registry -maxdepth 4 -type f || true

            exit 1
          fi

          echo ""
          echo "Production model artifact found."

          ls -lh "$MODEL_PATH"

      # ======================================================
      # STEP 9
      # Test model loading before monitoring
      # ======================================================

      - name: Test production model loading
        run: |
          python - <<'PY'
          from pathlib import Path
          import joblib
          import sklearn

          path = Path(
              "models/registry/LightGBM/v1/model.pkl"
          )

          print("scikit-learn:", sklearn.__version__)
          print("Model path:", path.resolve())
          print("Exists:", path.exists())

          model = joblib.load(path)

          print("Loaded object:", type(model))
          print("Production artifact load: SUCCESS")
          PY

      # ======================================================
      # STEP 10
      # Run complete daily MLOps pipeline
      # ======================================================

      - name: Run daily MLOps pipeline
        run: |
          python -m src.automation.daily_pipeline

      # ======================================================
      # STEP 11
      # Commit monitoring outputs
      # ======================================================

      - name: Commit monitoring reports
        if: success()
        shell: bash
        run: |
          git config user.name "aqi-automation-bot"
          git config user.email "aqi-automation-bot@users.noreply.github.com"

          git add -f results/monitoring/ || true

          if git diff --cached --quiet; then

            echo "No monitoring changes to commit."

          else

            git commit \
              -m "monitoring: update AQI monitoring reports [skip ci]"

            git pull --rebase origin main

            git push origin HEAD:main

          fi

      # ======================================================
      # STEP 12
      # Summary
      # ======================================================

      - name: Create workflow summary
        if: always()
        shell: bash
        run: |
          echo "# AQI Daily MLOps Monitoring" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Pipeline:" >> "$GITHUB_STEP_SUMMARY"

          echo "- Production model validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Feature drift detection" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model performance monitoring" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retraining assessment" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
