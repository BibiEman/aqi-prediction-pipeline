name: AQI Hourly Production Pipeline

"on":
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aqi-hourly-production
  cancel-in-progress: false

jobs:
  hourly-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Validate secrets
        shell: bash
        run: |
          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "OPENWEATHER_API_KEY is missing."
            exit 1
          fi

          if [ -z "$HOPSWORKS_API_KEY" ]; then
            echo "HOPSWORKS_API_KEY is missing."
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Run hourly AQI pipeline
        run: |
          python -m src.automation.hourly_pipeline

      - name: Commit updated AQI history
        shell: bash
        run: |
          git config user.name "aqi-automation-bot"
          git config user.email "aqi-automation-bot@users.noreply.github.com"

          git add data/raw/aqi_dataset.csv || true
          git add data/realtime/realtime_features.csv || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "automation: update AQI real-time data [skip ci]"
            git push
          fi
