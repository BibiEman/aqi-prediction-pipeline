name: AQI Hourly Production Pipeline

"on":
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aqi-hourly-production
  cancel-in-progress: false

jobs:
  hourly-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      # ======================================================
      # 1. Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ======================================================
      # 2. Python environment
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      # ======================================================
      # 3. Install dependencies
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install automation dependencies
        run: |
          pip install -r requirements-automation.txt

      # ======================================================
      # 4. Validate required secrets
      # ======================================================

      - name: Validate secrets
        shell: bash
        run: |
          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "ERROR: OPENWEATHER_API_KEY is missing."
            exit 1
          fi

          if [ -z "$HOPSWORKS_API_KEY" ]; then
            echo "ERROR: HOPSWORKS_API_KEY is missing."
            exit 1
          fi

          echo "Required secrets are configured."

      # ======================================================
      # 5. Basic environment check
      # ======================================================

      - name: Display environment information
        run: |
          python --version
          pip --version

          python -c "import hopsworks; print('hopsworks:', hopsworks.__version__)"
          python -c "import hsfs; print('hsfs:', hsfs.__version__)"

      # ======================================================
      # 6. Run production pipeline
      # ======================================================

      - name: Run hourly AQI pipeline
        run: |
          python -m src.automation.hourly_pipeline

      # ======================================================
      # 7. Verify generated files
      # ======================================================

      - name: Verify generated real-time files
        shell: bash
        run: |
          echo "Checking generated datasets..."

          if [ ! -f "data/raw/aqi_dataset.csv" ]; then
            echo "ERROR: data/raw/aqi_dataset.csv was not created."
            exit 1
          fi

          if [ ! -f "data/realtime/realtime_features.csv" ]; then
            echo "ERROR: data/realtime/realtime_features.csv was not created."
            exit 1
          fi

          echo "Raw dataset:"
          wc -l data/raw/aqi_dataset.csv

          echo "Real-time features:"
          wc -l data/realtime/realtime_features.csv

      # ======================================================
      # 8. Persist new real-time history
      # ======================================================

      - name: Commit updated AQI history
        shell: bash
        run: |
          git config user.name "aqi-automation-bot"
          git config user.email "aqi-automation-bot@users.noreply.github.com"

          git add data/raw/aqi_dataset.csv
          git add data/realtime/realtime_features.csv

          if git diff --cached --quiet; then
            echo "No AQI data changes to commit."
          else
            git commit -m "automation: update AQI real-time data [skip ci]"

            git pull --rebase origin main

            git push origin HEAD:main
          fi

      # ======================================================
      # 9. Workflow summary
      # ======================================================

      - name: Create workflow summary
        if: always()
        shell: bash
        run: |
          echo "# AQI Hourly Production Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline stages:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Real-time weather/AQI collection" >> "$GITHUB_STEP_SUMMARY"
          echo "- 3-hour feature engineering" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hopsworks Online Feature Store ingestion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
