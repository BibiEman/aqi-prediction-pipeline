name: AQI Automated Retraining

"on":
  schedule:
    # Runs every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aqi-retraining
  cancel-in-progress: false

jobs:
  retraining:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize repository
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt
          pip install xgboost lightgbm catboost

      - name: Validate production assets
        shell: bash
        run: |
          test -f models/registry/LightGBM/v1/model.pkl
          test -f data/processed/model_training_dataset.csv
          echo "Production assets available."

      - name: Run automated retraining assessment
        run: |
          python -m src.automation.retrain

      - name: Show production registry
        if: always()
        shell: bash
        run: |
          echo "Current registry:"
          cat models/registry.json || true

      - name: Commit model registry changes
        if: success()
        shell: bash
        run: |
          git config user.name "aqi-automation-bot"
          git config user.email "aqi-automation-bot@users.noreply.github.com"

          git add models/registry.json || true
          git add models/best_model.txt || true
          git add models/evaluation_results.csv || true
          git add models/evaluation_metadata.csv || true
          git add models/training_summary.csv || true

          git add -f models/registry/ || true

          if git diff --cached --quiet; then
            echo "No retraining/model changes to commit."
          else
            git commit -m "mlops: update production model registry [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Create workflow summary
        if: always()
        shell: bash
        run: |
          echo "# AQI Automated Retraining" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Monitoring executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retraining decision evaluated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retraining only occurs when required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Better model may be promoted to production" >> "$GITHUB_STEP_SUMMARY"
